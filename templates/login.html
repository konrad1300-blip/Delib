{% extends "base.html" %}

{% block title %}Logowanie - Delib{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <span class="brand-icon large">◈</span>
            <h1>Delib</h1>
            <p class="login-subtitle">System Wspierania Decyzji</p>
        </div>
        
        <form method="POST" action="{{ url_for('login') }}" class="login-form">
            <div class="form-group">
                <label for="username">Login</label>
                <input type="text" id="username" name="username" required autocomplete="username" 
                       placeholder="Wprowadź login">
            </div>
            
            <div class="form-group">
                <label for="password">Hasło</label>
                <input type="password" id="password" name="password" required autocomplete="current-password"
                       placeholder="Wprowadź hasło">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                Zaloguj się
            </button>
        </form>
        
        <div class="login-info">
            <p>Domyślne konta:</p>
            <ul>
                <li><strong>admin</strong> / admin123 (dostęp administratora)</li>
                <li><strong>user</strong> / user123 (dostęp użytkownika)</li>
            </ul>
        </div>
    </div>
</div>
{% endblock %}
